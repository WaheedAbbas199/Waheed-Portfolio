# docker compose up -d db && docker compose --profile tools run --rm migrate && docker compose up -d app
# docker compose run --rm app python -m scripts.create_admin --email you@example.com
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]            # not published to the host

  migrate:
    build: .
    profiles: ["tools"]
    command: ["alembic", "upgrade", "head"]
    environment: &env
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://portfolio:${POSTGRES_PASSWORD}@db:5432/portfolio
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      SITE_URL: ${SITE_URL:-https://example.com}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:?set PUBLIC_ORIGINS to your frontend URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Portfolio <onboarding@resend.dev>}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
    depends_on: {db: {condition: service_healthy}}
    networks: [backend]

  app:
    build: .
    restart: unless-stopped
    environment: *env
    depends_on: {db: {condition: service_healthy}}
    ports: ["127.0.0.1:8000:8000"]   # put a TLS reverse proxy (Caddy/nginx) in front
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

volumes:
  pgdata:
networks:
  backend:
